<div class="card">
  <h3>
    <a [routerLink]="['/courses', course().id]">
      {{ course().title }}
    </a>
    ({{ course().code }})
  </h3>

  <p>Enrolled {{ course().enrollmentCount }} of {{ course().maxCapacity }} seats</p>

  <span class="badge" [class.closed]="course().enrollmentCount >= course().maxCapacity">
    {{ course().enrollmentCount >= course().maxCapacity ? 'Full' : 'Accepting enrollments' }}
  </span>

  <div class="actions">
    @if (canEnroll()) {
      <button
        (click)="enrollClicked.emit(course())"
        [disabled]="course().enrollmentCount >= course().maxCapacity || enrollDisabled()"
      >
        Enroll
      </button>
    }
    @if (auth.hasRole('Admin')) {
      <button class="danger" type="button" (click)="deleteClicked.emit(course().id)">Delete</button>
    }
  </div>
</div>
